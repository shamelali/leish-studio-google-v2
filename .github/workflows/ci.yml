name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm run lint === tsc --noEmit (zero-error baseline)
      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      # vite build + esbuild server bundle -> api/[...path].js (gitignored,
      # regenerated on every build; Vercel runs the same script)
      - name: Build
        run: npm run build
