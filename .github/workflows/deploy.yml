# Push-to-deploy: runs the Phase 0 regression gate, then deploys to Vercel
# production from CI. VERCEL_TOKEN is a repository secret — once the native
# GitHub integration (Login Connection) is added in the Vercel dashboard this
# workflow can be removed in favour of preview deployments too.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never overlap production deploys; don't cancel an in-flight build.
concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regression tests (Phase 0 gate)
        run: npm test

      - name: Link Vercel project
        run: npx vercel link --yes --project leish-google --scope duta-integra --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to production
        run: npx vercel deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
